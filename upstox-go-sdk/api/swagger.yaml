      - rules
      - type
      properties:
        type:
          description: |-
            Type of GTT order. It can be one of the following:
            SINGLE refers to a single-leg GTT order
            MULTIPLE refers to a multi-leg GTT order
          example: SINGLE
          enum:
          - SINGLE
          - MULTIPLE
        quantity:
          description: Quantity with which the order is to be placed
          format: int32
          example: 1
